<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProposalGen — Client Proposal & Contract Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #0a0e1a;
        --bg-card: #111827;
        --bg-surface: #1a2235;
        --bg-surface2: #202c42;
        --accent-gold: #c9a84c;
        --accent-gold-light: #e8c96d;
        --accent-gold-dim: rgba(201, 168, 76, 0.15);
        --text-primary: #f0f4ff;
        --text-secondary: #8899bb;
        --text-muted: #4a5a7a;
        --border: #1e2d47;
        --border-light: #253552;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --info: #3b82f6;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
        --shadow-glow: 0 0 0 1px rgba(201, 168, 76, 0.2), 0 4px 24px rgba(0, 0, 0, 0.5);
        --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --font-display: 'Playfair Display', Georgia, serif;
        --font-body: 'DM Sans', system-ui, sans-serif;
        --font-cursive: 'Dancing Script', cursive;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-body);
        line-height: 1.6;
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
        display: flex;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-deep); }
      ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

      /* Focus */
      :focus-visible {
        outline: 2px solid var(--accent-gold);
        outline-offset: 2px;
      }

      /* Page fade-in */
      @keyframes pageIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes confettiFall {
        0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
      }

      /* Global button base */
      button { cursor: pointer; font-family: var(--font-body); border: none; }
      input, textarea, select { font-family: var(--font-body); }

      /* Print styles */
      @media print {
        .no-print { display: none !important; }
        body { background: white; color: black; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
